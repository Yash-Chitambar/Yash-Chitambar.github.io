<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e50f0" />
    </marker>
  </defs>
  <rect width="960" height="560" fill="#ffffff" />

  <!-- roboRIO panel -->
  <rect x="20" y="20" width="920" height="270" rx="14" fill="#f7f9ff" stroke="#c9d6ff" stroke-width="1.5" />
  <text x="40" y="50" font-size="16" font-weight="700" fill="#0b1b3a">roboRIO: command-based scheduler, 20 ms loop</text>

  <!-- Row 1 -->
  <rect x="40" y="70" width="190" height="86" rx="10" fill="#ffffff" stroke="#1e50f0" stroke-width="1.5" />
  <text x="135" y="94" font-size="14" font-weight="700" fill="#0b1b3a" text-anchor="middle">Driver input</text>
  <text x="135" y="114" font-size="12" fill="#52617d" text-anchor="middle">deadband, slew limit</text>
  <text x="135" y="132" font-size="12" fill="#52617d" text-anchor="middle">field-relative (gyro yaw)</text>

  <rect x="275" y="70" width="210" height="86" rx="10" fill="#ffffff" stroke="#1e50f0" stroke-width="1.5" />
  <text x="380" y="94" font-size="14" font-weight="700" fill="#0b1b3a" text-anchor="middle">Chassis to module states</text>
  <text x="380" y="114" font-size="12" fill="#52617d" text-anchor="middle">skew correction, inverse kinematics</text>
  <text x="380" y="132" font-size="12" fill="#52617d" text-anchor="middle">desaturate to 5 m/s</text>

  <rect x="530" y="70" width="200" height="86" rx="10" fill="#ffffff" stroke="#1e50f0" stroke-width="1.5" />
  <text x="630" y="94" font-size="14" font-weight="700" fill="#0b1b3a" text-anchor="middle">SwerveModule x4</text>
  <text x="630" y="114" font-size="12" fill="#52617d" text-anchor="middle">optimize to at most 90 deg</text>
  <text x="630" y="132" font-size="12" fill="#52617d" text-anchor="middle">steer PID, drive = v / v_max</text>

  <!-- Row 2 -->
  <rect x="40" y="190" width="190" height="84" rx="10" fill="#ffffff" stroke="#1e50f0" stroke-width="1.5" />
  <text x="135" y="214" font-size="14" font-weight="700" fill="#0b1b3a" text-anchor="middle">Pose estimator</text>
  <text x="135" y="234" font-size="12" fill="#52617d" text-anchor="middle">odometry + AprilTag fusion</text>
  <text x="135" y="252" font-size="12" fill="#52617d" text-anchor="middle">latency-compensated</text>

  <rect x="275" y="190" width="210" height="84" rx="10" fill="#ffffff" stroke="#1e50f0" stroke-width="1.5" />
  <text x="380" y="214" font-size="14" font-weight="700" fill="#0b1b3a" text-anchor="middle">Autonomy</text>
  <text x="380" y="234" font-size="12" fill="#52617d" text-anchor="middle">PathPlanner follower</text>
  <text x="380" y="252" font-size="12" fill="#52617d" text-anchor="middle">note and speaker alignment PIDs</text>

  <!-- internal arrows -->
  <line x1="230" y1="113" x2="273" y2="113" stroke="#1e50f0" stroke-width="2" marker-end="url(#a)" />
  <line x1="485" y1="113" x2="528" y2="113" stroke="#1e50f0" stroke-width="2" marker-end="url(#a)" />
  <line x1="380" y1="190" x2="380" y2="158" stroke="#1e50f0" stroke-width="2" marker-end="url(#a)" />
  <line x1="230" y1="232" x2="273" y2="232" stroke="#1e50f0" stroke-width="2" marker-end="url(#a)" />
  <line x1="135" y1="190" x2="135" y2="158" stroke="#1e50f0" stroke-width="2" marker-end="url(#a)" />
  <text x="143" y="178" font-size="11" fill="#52617d">yaw</text>
  <text x="388" y="178" font-size="11" fill="#52617d">chassis speeds</text>
  <text x="680" y="232" font-size="12" fill="#52617d">All loops run in one 20 ms cycle:</text>
  <text x="680" y="250" font-size="12" fill="#52617d">read sensors, estimate, command.</text>

  <!-- interface arrows -->
  <line x1="170" y1="292" x2="170" y2="398" stroke="#1e50f0" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)" />
  <text x="182" y="330" font-size="12" fill="#0b1b3a">duty-cycle commands</text>
  <text x="182" y="348" font-size="12" fill="#52617d">status frames back</text>

  <line x1="480" y1="398" x2="480" y2="292" stroke="#1e50f0" stroke-width="2.5" marker-end="url(#a)" />
  <text x="492" y="330" font-size="12" fill="#0b1b3a">steering angle, yaw</text>
  <text x="492" y="348" font-size="12" fill="#52617d">absolute, asynchronous</text>

  <line x1="790" y1="398" x2="790" y2="292" stroke="#1e50f0" stroke-width="2.5" marker-end="url(#a)" />
  <text x="802" y="330" font-size="12" fill="#0b1b3a">tag pose + latency</text>
  <text x="802" y="348" font-size="12" fill="#52617d">NetworkTables, ~ms</text>

  <!-- hardware -->
  <rect x="40" y="400" width="260" height="110" rx="10" fill="#eef3ff" stroke="#1e50f0" stroke-width="1.5" />
  <text x="170" y="430" font-size="14" font-weight="700" fill="#0b1b3a" text-anchor="middle">REV Spark MAX x8</text>
  <text x="170" y="452" font-size="12" fill="#52617d" text-anchor="middle">NEO x8 (drive + steer)</text>
  <text x="170" y="472" font-size="12" fill="#52617d" text-anchor="middle">roboRIO CAN bus, IDs 2 to 9</text>
  <text x="170" y="492" font-size="11" fill="#52617d" text-anchor="middle">unused status frames silenced</text>

  <rect x="350" y="400" width="260" height="110" rx="10" fill="#eef3ff" stroke="#1e50f0" stroke-width="1.5" />
  <text x="480" y="430" font-size="14" font-weight="700" fill="#0b1b3a" text-anchor="middle">CTRE CANcoder x4 + Pigeon 2</text>
  <text x="480" y="452" font-size="12" fill="#52617d" text-anchor="middle">CANivore, bus named "swerve"</text>
  <text x="480" y="472" font-size="12" fill="#52617d" text-anchor="middle">USB to CAN, IDs 10 to 14</text>
  <text x="480" y="492" font-size="11" fill="#52617d" text-anchor="middle">separate bus from the motors</text>

  <rect x="660" y="400" width="260" height="110" rx="10" fill="#eef3ff" stroke="#1e50f0" stroke-width="1.5" />
  <text x="790" y="430" font-size="14" font-weight="700" fill="#0b1b3a" text-anchor="middle">Limelight x2</text>
  <text x="790" y="452" font-size="12" fill="#52617d" text-anchor="middle">AprilTag localisation</text>
  <text x="790" y="472" font-size="12" fill="#52617d" text-anchor="middle">game-piece detection</text>
  <text x="790" y="492" font-size="11" fill="#52617d" text-anchor="middle">Ethernet</text>

  <text x="40" y="540" font-size="11" fill="#52617d">Arrow labels describe what crosses each interface. Gyro and encoders are CTRE, so they share the CANivore bus; the NEOs are REV.</text>
</svg>
